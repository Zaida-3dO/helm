[package]
name = "helm-app"
description = "The Helm desktop app: Tauri 2 shell around the host crates."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "helm"

[[bin]]
name = "helm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
helm-core.workspace = true
helm-ipc.workspace = true
helm-platform.workspace = true
helm-chats.workspace = true
helm-workers.workspace = true
helm-actions = { path = "../crates/actions" }
helm-projects = { path = "../crates/projects" }
helm-panel = { path = "../crates/panel" }
helm-search = { path = "../crates/search" }
helm-shell = { path = "../crates/shell" }
helm-terminal = { path = "../crates/terminal" }
helm-hosttools = { path = "../crates/hosttools" }
helm-mcp = { path = "../crates/mcp" }
helm-consent = { path = "../crates/consent" }
helm-usage = { path = "../crates/usage" }
helm-itemlinks = { path = "../crates/itemlinks" }
helm-schedules = { path = "../crates/schedules" }
helm-workflow = { path = "../crates/workflow" }
helm-afk = { path = "../crates/afk" }
helm-governor = { path = "../crates/governor" }
helm-relay = { path = "../crates/relay" }
helm-updates = { path = "../crates/updates" }
helm-waits = { path = "../crates/waits" }
helm-github = { path = "../crates/github" }
helm-webtools = { path = "../crates/webtools" }
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
env_logger = "0.11"
