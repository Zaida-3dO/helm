[package]
name = "helm-relay"
description = "Helm's outbound relay line to the Helm hub: one token-authenticated WebSocket, the external-caller gate for tools the hub forwards, and the Telegram chat tag."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
helm-core.workspace = true
helm-ipc.workspace = true
helm-chats.workspace = true
helm-platform.workspace = true
helm-hosttools = { path = "../hosttools" }
tokio.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v8"] }
sha2.workspace = true
log.workspace = true
# Plain ws on the LAN or Tailscale only (no TLS stack), like the hub's MCP endpoint.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
helm-consent = { path = "../consent" }
tempfile.workspace = true
