[package]
name = "helm-claudechats"
description = "Claude Code's own chat records: list, search and read them read-only, and continue one as a new Helm chat."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
helm-core.workspace = true
helm-chats.workspace = true
helm-ipc.workspace = true
helm-platform = { path = "../platform" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
ts-rs = { version = "10.1", features = ["serde-json-impl", "no-serde-warnings"] }

[dev-dependencies]
tempfile.workspace = true
