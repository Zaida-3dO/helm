[package]
name = "helm-usage"
description = "The read-only plan-usage meter. Readings come from the claude binary only (the get_usage control request and rate_limit_event); Request modes come from native transcripts."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
helm-core.workspace = true
helm-ipc.workspace = true
helm-workers.workspace = true
helm-hosttools = { path = "../hosttools" }
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
log.workspace = true
ts-rs = { version = "10.1", features = ["serde-json-impl", "no-serde-warnings"] }

[dev-dependencies]
tempfile.workspace = true
