[package]
name = "helm-localmodels"
description = "Local model servers (Strata, Ollama) on this machine: their settings and keys, the model catalogue, the memory check and model loading before a turn."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
helm-core.workspace = true
helm-ipc.workspace = true
helm-platform.workspace = true
helm-chats.workspace = true
helm-hosttools = { path = "../hosttools" }
helm-usage = { path = "../usage" }
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
log.workspace = true
ureq = { version = "3", default-features = false }
ts-rs = { version = "10.1", features = ["serde-json-impl", "no-serde-warnings"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
