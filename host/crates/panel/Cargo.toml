[package]
name = "helm-panel"
description = "The side panel's host side: the path gate, private roots, file viewer reads, the checked default-app handler, reveal and saved panel tabs."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
helm-core.workspace = true
helm-ipc.workspace = true
helm-platform.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
