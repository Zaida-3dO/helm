[package]
name = "helm-dictation"
description = "Dictation in the composer: the speech-to-text address and its safety rules, the transcription call, and the host tool that makes graphics memory room for speech."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
helm-core.workspace = true
helm-ipc.workspace = true
helm-hosttools = { path = "../hosttools" }
helm-localmodels = { path = "../localmodels" }
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
log.workspace = true
base64 = "0.22"
uuid.workspace = true
ureq = { version = "3", default-features = false }
ts-rs = { version = "10.1", features = ["serde-json-impl", "no-serde-warnings"] }

[target.'cfg(windows)'.dependencies]
# Windows' own speech service for live dictation (`live.rs`). Only the parts it needs:
# the recognizer classes, the async waits and the Runtime initialiser.
windows = { version = "0.62", features = [
  "Foundation",
  "Foundation_Collections",
  "Media_SpeechRecognition",
  "Win32_System_WinRT",
] }
windows-future = "0.3"

[dev-dependencies]
tempfile.workspace = true
helm-chats.workspace = true
helm-platform.workspace = true
