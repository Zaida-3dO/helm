[package]
name = "helm-profiles"
description = "Profiles: the people who use this Helm, the profile and device every chat carries, what is shared between profiles, and which profile the sidebar shows. A label for filtering, never a credential."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
helm-core.workspace = true
helm-ipc.workspace = true
helm-chats.workspace = true
helm-devices = { path = "../devices" }
helm-workers.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
uuid.workspace = true
log.workspace = true
ts-rs = { version = "10.1", features = ["serde-json-impl", "no-serde-warnings"] }

[dev-dependencies]
tempfile.workspace = true
