[package]
name = "helm-github"
description = "GitHub for the pull request view: the gh command-line tool under the user's own sign-in, a fixed read allowlist, compiled GraphQL documents and checked writes."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
helm-core.workspace = true
helm-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
rusqlite.workspace = true
# Debug builds only: the loopback transport that end-to-end checks point at a fake GitHub.
ureq = { version = "3", default-features = false }

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
