[package]
name = "helm-afk"
description = "M7a: auto-AFK on Windows (session lock, idle, sleep), AFK spans and the \"While you were out\" digest."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
helm-core.workspace = true
helm-ipc.workspace = true
helm-chats.workspace = true
helm-workflow = { path = "../workflow" }
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
uuid = { workspace = true, features = ["v8"] }
sha2.workspace = true
log.workspace = true
tokio.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
