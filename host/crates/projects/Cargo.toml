[package]
name = "helm-projects"
description = "Projects and the sidebar: folder and board projects in one tree, local nesting, chat grouping and order, and the read-only Agent Standup mirror."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
helm-core.workspace = true
helm-ipc.workspace = true
helm-hosttools = { path = "../hosttools" }
helm-chats.workspace = true
helm-platform.workspace = true
helm-workers.workspace = true
helm-worktrees = { path = "../worktrees" }
helm-standup = { path = "../standup" }
tokio.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
log.workspace = true
ts-rs = { version = "10.1", features = ["serde-json-impl", "no-serde-warnings"] }
# New board projects are posted to Agent Standup (the read-only client cannot write).
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile.workspace = true
