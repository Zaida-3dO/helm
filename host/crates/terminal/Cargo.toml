[package]
name = "helm-terminal"
description = "The terminal dock's host side: PTY sessions on ConPTY inside Job Objects, streamed over the one event channel with flow control."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
helm-core.workspace = true
helm-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
rusqlite.workspace = true
log.workspace = true
portable-pty = "0.9"
ts-rs = { version = "10.1", features = ["serde-json-impl", "no-serde-warnings"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
